; =============================================
; GSP Control - Configuration file
; Gyro-Stabilized Platform Control Application
; =============================================

[Network]
; IP адрес и порт центрального контроллера гироплатформы
ip=192.168.144.2
send_port=5500          
listen_port=5504        

;ip=127.0.0.1
;send_port=1020          ; порт, на который отправляем пакеты
;listen_port=1040        ; порт, на котором слушаем ответы (можно указать другой)

[Video]
port=5400
timeout_ms=40

; Таймаут определения потери связи (мс)
connection_timeout_ms=5000

[TargetIDs]
; Идентификаторы целевых нагрузок (первый байт пакета)
; По умолчанию: камера=11, дальномер=13, гироплатформа=41
camera=11
rangefinder=13
gyro=41

[Joystick]
; Индекс устройства SDL2 (-1 = автоматический выбор первого доступного)
device_index=-1

; Инверсия осей (true/false)
invert_yaw=false
invert_pitch=false

; Номера кнопок для команд камеры и дальномера (настраиваемые)
button_zoom_in=0
button_zoom_out=1
button_autofocus=2
button_focus_infinity=3
button_brightness_up=4
button_brightness_down=5
button_rangefinder_shot=6
; SDL-индекс кнопки слежения (должен быть свободен в switch MainWindow)
; повторное нажатие выключает TRACK_CMD=0. Клавиша T делает то же самое.
button_track=4

[Polling]
; Частота опроса гироплатформы (Гц)
gyro_hz=1

; Интервал опроса позиции зума камеры (мс)
zoom_poll_interval_ms=2500

[Camera]
; Фиксированные позиции зума (в формате VISCA Direct, 0x0000..0x4000 примерно)
; Можно менять под свою камеру
zoom_positions="0x0000,0x1000,0x2000,0x3000,0x4000"
zoom_position_names="1x,2x,4x,8x,10x"

; Текущая выбранная позиция зума по умолчанию (индекс из списка выше)
default_zoom_index=0

[Rangefinder]
; Минимальная защита от случайного выстрела
safety_lock_enabled=true

[Jetson]
; UDP канал протокола JEP (управление стримом и трекером на Jetson)
; send_port  — порт, на котором Jetson принимает JEP
; listen_port — локальный порт панели для ответов JEP
ip=192.168.144.2
send_port=5600
listen_port=5604

; Куда Jetson должен слать RTP. Пустой play_ip = автоопределение локального IPv4
; в той же подсети, что и Jetson. play_port должен совпадать с [Video]/port
play_ip=
play_port=5400
resolut=HD
bitrate=2500000

[Tracking]
; PID и инверсия знака уходят в CAPT set как есть
pid_x_p=0.5
pid_x_i=0.0
pid_x_d=0.05
pid_y_p=0.5
pid_y_i=0.0
pid_y_d=0.05
inv_az=0
inv_el=0

; 0=выкл, 1=слежение + перехват ГСП, 2=только слежение
track_cmd=1
; 1=ТВ камера, 2=тепловизор
video_channel=1
strobe_x_sz=64
strobe_y_sz=64
poll_interval_ms=200